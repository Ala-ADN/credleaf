services:
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: credleaf-airflow:3.1.5
    user: "${AIRFLOW_UID:-50000}:0"
    restart: unless-stopped
    environment:
      CREDLEAF_QDRANT_URL: http://qdrant:6333
      CREDLEAF_ARCHIVE_SLOTS: "${CREDLEAF_ARCHIVE_SLOTS:-2}"
      AIRFLOW__CORE__PARALLELISM: "8"
      AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "120"
      AIRFLOW__DAG_PROCESSOR__PRINT_STATS_INTERVAL: "0"
      AIRFLOW__LOGGING__LOGGING_CONFIG_CLASS: pipeline.airflow_logging.LOGGING_CONFIG
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - airflow_state:/opt/airflow
      - ./data:/opt/credleaf/data
      - ./dags:/opt/credleaf/dags:ro
      - ./src:/opt/credleaf/src:ro
      - ./scripts:/opt/credleaf/scripts:ro
      - ./notebooks:/opt/credleaf/notebooks
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)"
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - 6333:6333
      - 6334:6334
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./data/qdrant:/qdrant/storage

volumes:
  airflow_state:

configs:
  qdrant_config:
    content: |
      log_level: INFO
