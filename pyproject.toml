[project]
name = "credleaf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "internetarchive>=5.8.0",
    "pydantic>=2.13.3",
    "trafilatura>=2.0.0",
    "chonkie>=0.1.0",
    "torch>=2.0.0",
    "fast-langdetect>=1.0.1",
    "spacy>=3.7.0",
    "scipy>=1.11.0",
    "cartopy>=0.22.0",
    "shapely>=2.0.0",
    "numpy>=1.26.0",
    "datasketch>=1.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "jupyter>=1.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "ffmpeg-python",
    "ipywidgets>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Single source root: ship everything under src/ at top-level.
sources = ["src"]
only-include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
